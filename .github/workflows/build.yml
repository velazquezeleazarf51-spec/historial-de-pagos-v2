name: Build APK Historial de pagos v2
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar claves de firma
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Faltan los secretos KEYSTORE_BASE64 y KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Descomprimir zip
        run: unzip -q historial-de-pagos.zip -d proyecto
      - name: Detectar carpeta
        id: detect
        run: |
          F=$(find proyecto -name capacitor.config.json -not -path '*/node_modules/*' | head -1)
          echo "dir=$(dirname "$F")" >> $GITHUB_OUTPUT
      - name: Preparar Android
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          npm install
          npx cap add android
          npx capacitor-assets generate --android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' "$M"
          grep -q 'xmlns:tools' "$M" || sed -i '0,/<manifest/s//<manifest xmlns:tools="http:\/\/schemas.android.com\/tools"/' "$M"
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" */>|<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />|' "$M"
          npx cap sync android
      - name: Compilar Release
        working-directory: ${{ steps.detect.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Firmar y verificar APK
        working-directory: ${{ steps.detect.outputs.dir }}
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/historial.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/historial.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias historial --out "$GITHUB_WORKSPACE/HistorialDePagos-v2.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/HistorialDePagos-v2.apk"
          rm -f "$RUNNER_TEMP/historial.jks"
          APK="$GITHUB_WORKSPACE/HistorialDePagos-v2.apk"
          if "$BT/aapt2" dump permissions "$APK" | grep -qi "permission: android.permission.INTERNET"; then
            echo "::warning::La APK todavia tiene permiso de Internet."
          fi
          if "$BT/aapt2" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::La APK es depurable."
            exit 1
          fi
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0-${{ github.run_number }}" HistorialDePagos-v2.apk \
            --title "Historial de pagos v2.0 (build ${{ github.run_number }})" \
            --notes "APK firmada (Release)."
      - uses: actions/upload-artifact@v4
        with:
          name: HistorialDePagos-v2-APK
          path: HistorialDePagos-v2.apk
